# GitLab CI/CD Pipeline for Hotel Booking REST API System
# Stages: Test -> Build -> Deploy

stages:
  - test
  - build
  - deploy

# Define variables
variables:
  DOCKER_IMAGE_NAME: "final-project-api"
  DOCKER_REGISTRY: "registry.gitlab.com"
  DEPLOYMENT_PATH: "/opt/apps/compose/final-project"
  NODE_IMAGE: "node:20-alpine"
  DOCKER_IMAGE: "docker:latest"

# Cache node_modules to speed up builds
.cache_node_modules:
  cache:
    paths:
      - app/node_modules/
    key: ${CI_COMMIT_REF_SLUG}


# ============================================================
# STAGE 1: TEST
# ============================================================

# Unit Tests
test:unit:
  stage: test
  image: ${NODE_IMAGE}
  extends: .cache_node_modules
  before_script:
    - cd app
    - npm ci
  script:
    - echo "Running unit tests..."
    - npm run test:unit -- --coverage --maxWorkers=2
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: app/coverage/cobertura-coverage.xml
    paths:
      - app/coverage/
    expire_in: 30 days
  allow_failure: false
  only:
    - main
    - merge_requests

# Integration Tests (requires DB/Redis, will be skipped if services unavailable)
test:integration:
  stage: test
  image: ${NODE_IMAGE}
  extends: .cache_node_modules
  services:
    - mysql:8.0
    - redis:7-alpine
  variables:
    MYSQL_ROOT_PASSWORD: "test_root_pass"
    MYSQL_DATABASE: "test_db"
    MYSQL_USER: "test_user"
    MYSQL_PASSWORD: "test_pass"
    DATABASE_URL: "mysql://test_user:test_pass@mysql:3306/test_db"
    JWT_SECRET: "test-jwt-secret-key-min-32-chars-long!"
    REDIS_HOST: "redis"
    REDIS_PORT: "6379"
  before_script:
    - cd app
    - npm ci
    - npx prisma generate
  script:
    - echo "Running integration tests..."
    - npm run test:integration -- --maxWorkers=2 || echo "Integration tests skipped (DB unavailable)"
  artifacts:
    paths:
      - app/test-results/
    expire_in: 30 days
  allow_failure: true
  only:
    - main
    - merge_requests

# Code Quality Check (linting)
test:lint:
  stage: test
  image: ${NODE_IMAGE}
  extends: .cache_node_modules
  before_script:
    - cd app
    - npm ci
  script:
    - echo "Checking code quality..."
    - npm run format:check || echo "Code formatting issues found (informational only)"
  allow_failure: true
  only:
    - main
    - merge_requests


# ============================================================
# STAGE 2: BUILD
# ============================================================

# Build Docker Image
build:docker:
  stage: build
  image: ${DOCKER_IMAGE}
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "Building Docker image for deployment..."
  script:
    - cd app
    - docker build -t ${DOCKER_IMAGE_NAME}:latest -f Dockerfile .
    - echo "Docker image built successfully: ${DOCKER_IMAGE_NAME}:latest"
  only:
    - main
  when: on_success


# ============================================================
# STAGE 3: DEPLOY
# ============================================================

# Deploy to Production Server
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    # Install required tools
    - apk add --no-cache openssh-client git bash curl

    # Setup SSH key for deployment
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # Add SSH key to known hosts (adjust hostname as needed)
    - ssh-keyscan -H 10.34.112.129 >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    # SSH into server and deploy
    - |
      ssh -i ~/.ssh/deploy_key_final-project $DEPLOY_USER@10.34.112.129 << 'EOF'

      echo "=========================================="
      echo "Deploying Hotel Booking API System"
      echo "=========================================="

      # Navigate to deployment directory
      cd /opt/apps/compose/final-project || exit 1

      # Pull latest changes
      echo "Pulling latest code..."
      git pull origin main

      # Update environment variables if needed
      echo "Checking environment configuration..."
      if [ ! -f "infra/.env" ]; then
        echo "ERROR: infra/.env not found. Please create it first."
        exit 1
      fi

      if [ ! -f "app/.env.docker" ]; then
        echo "WARNING: app/.env.docker not found. Copy from .env.docker.example"
        cp app/.env.docker.example app/.env.docker || true
      fi

      # Stop existing containers
      echo "Stopping existing services..."
      cd infra
      docker-compose down || true

      # Build and start new containers
      echo "Building and starting services..."
      docker-compose up --build -d

      # Wait for services to be ready
      echo "Waiting for services to be ready..."
      sleep 10

      # Run database migrations
      echo "Running database migrations..."
      docker-compose exec -T app npx prisma db push || echo "Migration already applied"

      # Verify deployment
      echo "Verifying deployment..."
      HEALTH_STATUS=$(curl -s http://localhost:3000/health | grep -o '"status":"ok"' || echo "")

      if [ -n "$HEALTH_STATUS" ]; then
        echo "✅ Deployment successful! API is healthy."
      else
        echo "⚠️  API health check pending. Services may still be starting up."
      fi

      # Show running containers
      echo ""
      echo "Running Docker containers:"
      docker-compose ps

      echo "=========================================="
      echo "Deployment completed"
      echo "=========================================="

      EOF
  environment:
    name: production
    url: http://10.34.112.129/api
  only:
    - main
  when: manual
  variables:
    DEPLOY_USER: "deploy"
  tags:
    - docker


# ============================================================
# HELPER: Manual Rollback (if needed)
# ============================================================

deploy:rollback:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H 10.34.112.129 >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh -i ~/.ssh/deploy_key_final-project $DEPLOY_USER@10.34.112.129 << 'EOF'

      echo "Rolling back deployment..."
      cd /opt/apps/compose/final-project/infra

      # Checkout previous commit
      cd ..
      git checkout HEAD~1

      # Restart services
      cd infra
      docker-compose down
      docker-compose up --build -d

      echo "Rollback completed"

      EOF
  environment:
    name: production
    action: rollback
  only:
    - main
  when: manual
  variables:
    DEPLOY_USER: "deploy"

---

# ============================================================
# SUCCESS / FAILURE NOTIFICATIONS
# ============================================================

success:notification:
  stage: .post
  image: alpine:latest
  script:
    - echo "Pipeline completed successfully"
  when: on_success
  only:
    - main

failure:notification:
  stage: .post
  image: alpine:latest
  script:
    - echo "Pipeline failed - check logs for details"
  when: on_failure
  only:
    - main
