stages:
  - deploy

deploy-simple:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

  script:
    - echo "Deploying to $SERVER_HOST:$SERVER_PATH ..."
    - |
      ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" << DEPLOY
        set -e

        echo "── Pull latest code ──"
        cd "$SERVER_PATH"
        git pull origin main

        echo "── Move to infra folder ──"
        cd "$SERVER_PATH/infra"

        echo "── Build containers ──"
        docker compose build

        echo "── Restart containers ──"
        docker compose up -d

        echo "── Clean up old images ──"
        docker image prune -f

        echo "── Status ──"
        docker compose ps

        echo "── Deploy complete ──"
      DEPLOY

    - echo "Done."