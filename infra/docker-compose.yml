services:
  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: final_project_app
    ports:
      - "3000:3000"
    env_file:
      - ../app/.env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: final_project_redis
    ports:
      - "6379:6379"
    restart: unless-stopped